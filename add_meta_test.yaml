# parameters:
  MACHINE:
    desc: "RCAR Gen4-based device"
    "sparrow-hawk":
      default: true
      overrides:
        variables:
          MACHINE: "sparrow-hawk"
          SOC_FAMILY: "r8a779g3"
        components:
          domd:
            sources:
              - type: git
                url: https://github.com/rcar-community/meta-sparrow-hawk
                rev: scarthgap
            builder:
              layers:
                - "../meta-sparrow-hawk"
          domu:
            builder:
              layers:
                - "../meta-sparrow-hawk"
  ADD_META_TEST:
    desc: "Add meta-test layer and some configs"
    "no":
      desc: "Nothing to do"
      default: true
    "yes":
      overrides:
        components:
          dom0:
            builder:
              layers:
                - "../../../meta-xen-dom0"
                - "../../../meta-xen-domx"
                - "../meta-openembedded/meta-multimedia"
              external_src:
                core-image-thin-initramfs: "%{YOCTOS_WORK_DIR}/%{DOMD_BUILD_DIR}/tmp/deploy/images/%{MACHINE}/"
              conf:
                - [XT_XEN_DTB_NAME, "%{XT_XEN_DTB_NAME}"]
                - [BBMASK:append, "|meta-xt-prod-devel-rcar-gen4/meta-xt-dom0-gen4/recipes-kernel"]
          domd:
            builder:
              layers:
                - "../../../meta-xen-domd"
                - "../../../meta-xen-domx"
                - "../meta-openembedded/meta-multimedia"
              conf:
                - [IMAGE_INSTALL:append, " iperf3 htop tcpdump coreutils ethtool"]
                - [BBMASK:append, "|meta-xt-rcar/meta-xt-gateway/meta-xt-domd-gen4/recipes-bsp/u-boot"]
                - [BBMASK:append, "|meta-xt-prod-devel-rcar-gen4/meta-xt-domd-gen4/recipes-bsp/u-boot"]
                  #- [BBMASK:append, "|meta-renesas-upstream-bsp/recipes-bsp/optee"]
                  #- [BBMASK:append, "|meta-renesas-upstream-bsp/recipes-bsp/arm-trusted-firmware/"]
                # GFX doesn't support now
                - [BBMASK:append, "|recipes-graphics/gles-user-module"]
                - [BBMASK:append, "|recipes-kernel/kernel-module-gles"]
                - [BBMASK:append, "|meta-xt-rcar/meta-xt-rcar-gles_common/recipes-graphics/gles-module"]
                - [BBMASK:append, "|meta-xt-rcar/meta-xt-rcar-gles_common/recipes-kernel/kernel-module-gles"]
                - [BBMASK:append, "|meta-sparrow-hawk/recipes-core/systemd/"]
                # rcar-image-XXXX is not prepared in upstream-bsp
                - [BBMASK:append, "|meta-xt-prod-devel-rcar-gen4/meta-xt-domd-gen4/recipes-core/images/rcar-"]
                - [BBMASK:append, "|meta-xt-prod-devel-rcar-gen4/meta-xt-driver-domain-gen4/recipes-core/images/rcar-"]
                # CPU rendering
                - [IMAGE_INSTALL:append, " mesa glmark2 kernel-devicetree"]
                - [DISTRO_FEATURES_NATIVESDK:append, "wayland x11"]
                - [DISTRO_FEATURES:append, " pam wayland"]
                - [DISTRO_FEATURES:remove, " ptest x11 vulkan"]
                #- [IMAGE_INSTALL:append, " optee-os"]
              target_images:
                - "tmp/deploy/images/%{MACHINE}/flash.bin"
          domu:
            builder:
              layers:
                - "../meta-openembedded/meta-networking"
                - "../meta-openembedded/meta-multimedia"
                - "../../../meta-xen-domu"
                - "../../../meta-xen-domx"
              conf:
                - [IMAGE_INSTALL:append, " iperf3 htop tcpdump libaio coreutils rt-tests ethtool fio"]
                - [EXTRA_IMAGE_FEATURES:append, " ssh-server-openssh"]
        images:
          full:
            partitions:
              boot:
                items:
                  "flash.bin": "%{YOCTOS_WORK_DIR}/build-domd/tmp/deploy/images/%{MACHINE}/flash.bin"
                  "fitImage": "%{YOCTOS_WORK_DIR}/build-dom0/tmp/deploy/images/generic-armv8-xt/fitImage"

