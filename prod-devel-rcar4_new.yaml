desc: "Xen-Troops development setup for Renesas RCAR Gen4 hardware"
min_ver: "0.15"

variables:
  YOCTOS_WORK_DIR: "yocto"
  DOM0_BUILD_DIR: "build-dom0"
  DOMD_BUILD_DIR: "build-domd"
  DOMU_BUILD_DIR: "build-domu"
  XT_DOMD_DTB_NAME: "%{SOC_FAMILY}-%{MACHINE}-domd.dtb"
  XT_DOMU_DTB_NAME: "%{SOC_FAMILY}-%{MACHINE}-domu.dtb"
  XT_XEN_DTB_NAME: "%{SOC_FAMILY}-%{MACHINE}-xen.dtb"
  XT_GENERIC_DOMU_TAG: ""
  XT_DOMD_CONFIG_NAME: "domd-%{MACHINE}.cfg"
  XT_DOMU_CONFIG_NAME: "domu-%{MACHINE}.cfg"
  XT_KERNEL_BRANCH: "v5.10.41/rcar-5.1.7.rc11.2-xt"
  XT_KERNEL_REV: "${AUTOREV}"
common_data:
  # Sources used by all yocto-based domains
  sources: &COMMON_SOURCES
    - type: git
      url: "git://git.yoctoproject.org/poky"
      rev: kirkstone
    - type: git
      url: "git://git.openembedded.org/meta-openembedded"
      rev: kirkstone
    - type: git
      url: "git://git.yoctoproject.org/meta-virtualization"
      rev: kirkstone
    - type: git
      url: "https://github.com/Deedone/meta-xt-common.git"
      rev: v4h_xt_wip
    - type: git
      url: "https://github.com/xen-troops/meta-xt-prod-devel-rcar-gen4.git"
      rev: v4h_demo

  # Sources to be used in DomD and DomU
  domd_domu_sources: &DOMD_DOMU_SOURCES
    - type: git
      url: https://github.com/rshym/meta-renesas.git
      rev: rsm_v4h_kirkstone
    - type: git
      url: https://github.com/Deedone/meta-xt-rcar
      rev: v4h_xt_wip

  # Common configuration options for all yocto-based domains
  conf: &COMMON_CONF
    - [DL_DIR, "${TOPDIR}/../common_data/downloads"]

    # Skip warning about missing "virtualization" distro feature
    - [SKIP_META_VIRT_SANITY_CHECK, "1"]

    # Use hypervisor console on all guests
    - [SERIAL_CONSOLES, "115200;hvc0"]

    # Remove features that we are not using
    - [DISTRO_FEATURES:remove, "x11 gtk gobject-introspection-data wifi nfc
            bluetooth irda zeroconf 3g sysvinit acl alsa argp pcmcia usbgadget
            usbhost  ptest multiarch  vulkan sysvinit pulseaudio"]
  # Conf options for domain that are built used renesas layer
  domd_domu_conf: &DOMD_DOMU_CONF
    - [MACHINE, "%{MACHINE}"]
    - [SOC_FAMILY, "%{SOC_FAMILY}"]

    # Add systemd configuration
    - [DISTRO_FEATURES:append, " systemd"]
    - [VIRTUAL-RUNTIME_init_manager, "systemd"]

    # add the static lib to SDK toolchain
    - [SDKIMAGE_FEATURES:append, " staticdev-pkgs"]

    # Add for gstreamer plugins ugly
    - [LICENSE_FLAGS_ACCEPTED, "commercial"]

    # Add Capacity Aware migration Strategy (CAS)
    - [MACHINE_FEATURES:append, " cas"]

    # Remove ptest to reduce the build time
    - [DISTRO_FEATURES:remove, "ptest"]

    # Generate ext4 image files
    - [IMAGE_FSTYPES:append, " ext4"]

    # Mask Renesas OP-TEE
    - [BBMASK:append, " /meta-renesas/meta-rcar-gateway/recipes-bsp/optee"]

    - [PACKAGECONFIG:remove, "perf"]
    - [PACKAGECONFIG:remove, "tools-profile"]
    - [RENESAS_EXTRA_IMAGE_FEATURES:remove, "tools-profile"]
    - [CORE_IMAGE_EXTRA_INSTALL:remove, "perf"]
    - [MACHINE_FEATURES:append, " gsx"]

components:
  dom0:
    build-dir: "%{YOCTOS_WORK_DIR}"
    default: true
    sources:
      - *COMMON_SOURCES
    builder:
      type: yocto
      work_dir: "%{DOM0_BUILD_DIR}"
      conf:
        - *COMMON_CONF
        - [MACHINE, "generic-armv8-xt"]
        - [XT_DOM_NAME, "dom0"]
        - [XT_DOMD_CONFIG_NAME, "%{XT_DOMD_CONFIG_NAME}"]
        - [XT_DOMU_CONFIG_NAME, "%{XT_DOMU_CONFIG_NAME}"]
        - [XT_DOMD_DTB_NAME, "%{XT_DOMD_DTB_NAME}"]
        - [XT_DOMU_DTB_NAME, "%{XT_DOMU_DTB_NAME}"]
        - [XT_GUEST_INSTALL, "%{XT_GENERIC_DOMU_TAG} domd"]

        # Disable HWDB which quite huge (around 15MB) and is not required at all
        - [BAD_RECOMMENDATIONS:append, " udev-hwdb"]

        # Enable systemd on dom0
        - [DISTRO_FEATURES:append, " systemd"]
        - [VIRTUAL-RUNTIME_init_manager, "systemd"]

        # Do not install kernel image to rootfs to decrease initrd size
        - ["RRECOMMENDS:${KERNEL_PACKAGE_NAME}-base", ""]

        - [PREFERRED_VERSION_xen-tools, "4.19.0+git%"]
        - [PREFERRED_VERSION_xen, "4.19.0+git%"]

      layers:
        - "../meta-virtualization"
        - "../meta-openembedded/meta-oe"
        - "../meta-openembedded/meta-filesystems"
        - "../meta-openembedded/meta-python"
        - "../meta-openembedded/meta-networking"
        - "../meta-xt-common/meta-xt-control-domain"
        - "../meta-xt-common/meta-xt-dom0"
        - "../meta-xt-common/meta-xt-domx"
        - "../meta-xt-prod-devel-rcar-gen4/meta-xt-dom0-gen4"
        - "../meta-xt-prod-devel-rcar-gen4/meta-xt-domx-gen4"
        - "../meta-xt-prod-devel-rcar-gen4/meta-xt-prod-devel-rcar-control-gen4"
      build_target: core-image-thin-initramfs
      external_src:
        domd: "%{YOCTOS_WORK_DIR}/%{DOMD_BUILD_DIR}/tmp/deploy/images/%{MACHINE}/"
      additional_deps:
        - "%{DOMD_BUILD_DIR}/tmp/deploy/images/%{MACHINE}/Image"
      target_images:
        - "tmp/deploy/images/generic-armv8-xt/Image"
        - "tmp/deploy/images/generic-armv8-xt/uInitramfs"
  domd:
    build-dir: "%{YOCTOS_WORK_DIR}"
    sources:
      - *COMMON_SOURCES
      - *DOMD_DOMU_SOURCES
      - type: git
        url: git://git.yoctoproject.org/meta-selinux
        rev: kirkstone
    builder:
      type: yocto
      work_dir: "%{DOMD_BUILD_DIR}"
      conf:
        - *COMMON_CONF
        - *DOMD_DOMU_CONF
        - [XT_DOM_NAME, "domd"]
        - [XT_DEVICE_TREES, "%{XT_DOMD_DTB_NAME} %{XT_XEN_DTB_NAME}"]
        - [XT_KERNEL_BRANCH, "%{XT_KERNEL_BRANCH}"]
        - [XT_KERNEL_REV, "%{XT_KERNEL_REV}"]
        - [IMAGE_INSTALL:append, " iperf3"]
        - [IMAGE_INSTALL:append, " smcroute"]
        - [IMAGE_INSTALL:append, " snort"]
        - [PREFERRED_VERSION_xen-tools, "4.19.0+git%"]
        - [PREFERRED_VERSION_xen, "4.19.0+git%"]

        - [KERNEL_DEVICETREE:remove, "renesas/r8a779g0-whitehawk-native.dtb"]
        # we have to use opencv 4.1, but meta-oe provides 4.5.5
        - [BBMASK:append, "  meta-openembedded/meta-oe/recipes-support/opencv"]
        # we have to use tbb 2020.2 instead of 2021.5 for opencv 4.1
        - [BBMASK:append, "  meta-openembedded/meta-oe/recipes-support/tbb"]

      build_target: core-image-weston
      layers:
        - "../meta-virtualization"
        - "../meta-selinux"
        - "../meta-openembedded/meta-oe"
        - "../meta-openembedded/meta-networking"
        - "../meta-openembedded/meta-python"
        - "../meta-openembedded/meta-filesystems"
        - "../meta-xt-common/meta-xt-domx"
        - "../meta-xt-common/meta-xt-driver-domain"
        - "../meta-xt-common/meta-xt-security"
        - "../meta-xt-rcar/meta-xt-gateway/meta-xt-domd-gen4"
        - "../meta-xt-rcar/meta-xt-gateway/meta-xt-domx-gen4"
        - "../meta-xt-rcar/meta-xt-rcar-gles_common"
        - "../meta-xt-prod-devel-rcar-gen4/meta-xt-domd-gen4"
        - "../meta-xt-prod-devel-rcar-gen4/meta-xt-domx-gen4"
        - "../meta-xt-prod-devel-rcar-gen4/meta-xt-driver-domain-gen4"
      target_images:
        - "tmp/deploy/images/%{MACHINE}/Image"
        - "tmp/deploy/images/%{MACHINE}/core-image-weston-%{MACHINE}.ext4"
        - "tmp/deploy/images/%{MACHINE}/bl31-%{MACHINE}.srec"
        - "tmp/deploy/images/%{MACHINE}/tee-%{MACHINE}.srec"
        - "tmp/deploy/images/%{MACHINE}/u-boot-elf-%{MACHINE}.srec"
        - "tmp/deploy/images/%{MACHINE}/xen-%{MACHINE}"
        - "tmp/deploy/images/%{MACHINE}/xenpolicy-4.19-unstable"
        - "tmp/deploy/images/%{MACHINE}/%{XT_XEN_DTB_NAME}"
        - "tmp/deploy/images/%{MACHINE}/boot-tftp.uImage"
        - "tmp/deploy/images/%{MACHINE}/boot-emmc.uImage"
  domu:
    build-dir: "%{YOCTOS_WORK_DIR}"
    sources:
      - *COMMON_SOURCES
      - *DOMD_DOMU_SOURCES
    builder:
      type: yocto
      work_dir: "%{DOMU_BUILD_DIR}"
      conf:
        - *COMMON_CONF
        - *DOMD_DOMU_CONF
        - [XT_DOM_NAME, "domu"]
        - [XT_KERNEL_BRANCH, "%{XT_KERNEL_BRANCH}"]
        - [XT_KERNEL_REV, "%{XT_KERNEL_REV}"]
        - [IMAGE_INSTALL:append, " iperf3 "]
        # This is temporary workaround required because we use linux-libc-headers 5.10
        # and xt-common provides 6.4 already. So we need this bbmask until upgrade to 6.4
        - [BBMASK:append, " meta-xt-common/meta-xt-domu/recipes-kernel/linux-libc-headers/"]
        # we have to use opencv 4.1, but meta-oe provides 4.5.5
        - [BBMASK:append, "  meta-openembedded/meta-oe/recipes-support/opencv"]
        # we have to use tbb 2020.2 instead of 2021.5 for opencv 4.1
        - [BBMASK:append, "  meta-openembedded/meta-oe/recipes-support/tbb"]

      layers:
        - "../meta-openembedded/meta-oe"
        - "../meta-openembedded/meta-filesystems"
        - "../meta-openembedded/meta-python"
        - "../meta-xt-common/meta-xt-domu"
        - "../meta-xt-common/meta-xt-security"
        - "../meta-xt-prod-devel-rcar-gen4/meta-xt-domx-gen4"
        - "../meta-xt-prod-devel-rcar-gen4/meta-xt-domu-gen4"
        - "../meta-xt-rcar/meta-xt-rcar-gles_common"
      build_target: core-image-weston
      target_images:
        - "tmp/deploy/images/%{MACHINE}/Image"
        - "tmp/deploy/images/%{MACHINE}/core-image-weston-%{MACHINE}.ext4"

  boot_artifacts:
    build-dir: "artifacts"
    builder:
      type: archive
      name: "s4-%{MACHINE}-boot-artifacts.tar.bz"
      items:
        - "%{YOCTOS_WORK_DIR}/%{DOM0_BUILD_DIR}/tmp/deploy/images/generic-armv8-xt/Image"
        - "%{YOCTOS_WORK_DIR}/%{DOM0_BUILD_DIR}/tmp/deploy/images/generic-armv8-xt/uInitramfs"
        - "%{YOCTOS_WORK_DIR}/%{DOMD_BUILD_DIR}/tmp/deploy/images/%{MACHINE}/bl31-%{MACHINE}.srec"
        - "%{YOCTOS_WORK_DIR}/%{DOMD_BUILD_DIR}/tmp/deploy/images/%{MACHINE}/u-boot-elf-%{MACHINE}.srec"
        - "%{YOCTOS_WORK_DIR}/%{DOMD_BUILD_DIR}/tmp/deploy/images/%{MACHINE}/xen-%{MACHINE}"
        - "%{YOCTOS_WORK_DIR}/%{DOMD_BUILD_DIR}/tmp/deploy/images/%{MACHINE}/xenpolicy-4.19-unstable"
        - "%{YOCTOS_WORK_DIR}/%{DOMD_BUILD_DIR}/tmp/deploy/images/%{MACHINE}/%{XT_XEN_DTB_NAME}"

images:
  full:
    type: gpt
    desc: "Full SD-card/eMMC image"
    partitions:
      boot:
        gpt_type: 21686148-6449-6E6F-744E-656564454649 # BIOS boot partition (kinda...)
        type: ext4
        size: 128 MiB
        items:
          "Image": "%{YOCTOS_WORK_DIR}/build-dom0/tmp/deploy/images/generic-armv8-xt/Image"
          "uInitramfs": "%{YOCTOS_WORK_DIR}/build-dom0/tmp/deploy/images/generic-armv8-xt/uInitramfs"
          "xen": "%{YOCTOS_WORK_DIR}/build-domd/tmp/deploy/images/%{MACHINE}/xen-%{MACHINE}"
          "xenpolicy": "%{YOCTOS_WORK_DIR}/build-domd/tmp/deploy/images/%{MACHINE}/xenpolicy-4.19-unstable"
          "xen.dtb": "%{YOCTOS_WORK_DIR}/build-domd/tmp/deploy/images/%{MACHINE}/%{XT_XEN_DTB_NAME}"
      domd_rootfs:
        gpt_type: B921B045-1DF0-41C3-AF44-4C6F280D3FAE # Linux aarch64 root
        type: raw_image
        image_path: "%{YOCTOS_WORK_DIR}/build-domd/tmp/deploy/images/%{MACHINE}/core-image-weston-%{MACHINE}.ext4"

parameters:
  ENABLE_DOMU:
    desc: "Build generic Yocto-based DomU"
    "no":
      default: true
    "yes":
      overrides:
        variables:
          XT_GENERIC_DOMU_TAG: "domu"
        components:
          dom0:
            builder:
              additional_deps:
                - "%{DOMU_BUILD_DIR}/tmp/deploy/images/%{MACHINE}/Image"
              external_src:
                domu: "%{YOCTOS_WORK_DIR}/%{DOMU_BUILD_DIR}/tmp/deploy/images/%{MACHINE}/"
        images:
          full:
            partitions:
              domu-rootfs:
                type: raw_image
                gpt_type: 0FC63DAF-8483-4772-8E79-3D69D8477DE4 # Linux filesystem data
                image_path: "%{YOCTOS_WORK_DIR}/%{DOMU_BUILD_DIR}/tmp/deploy/images/%{MACHINE}/core-image-weston-%{MACHINE}.ext4"
# parameters:
  MACHINE:
    desc: "RCAR Gen4-based device"
    "sparrow-hawk":
      default: true
      overrides:
        variables:
          MACHINE: "sparrow-hawk"
          SOC_FAMILY: "r8a779g3"
        components:
          domd:
            sources:
              - type: git
                url: https://github.com/rcar-community/meta-sparrow-hawk
                rev: scarthgap
                #url: https://github.com/yhamamachi/meta-sparrow-hawk
                #rev: scarthgap-dev-pcie-test
            builder:
              layers:
                - "../meta-sparrow-hawk"
          domu:
            builder:
              layers:
                - "../meta-sparrow-hawk"
  ADD_META_TEST:
    desc: "Add meta-test layer and some configs"
    "no":
      desc: "Nothing to do"
      default: true
    "yes":
      overrides:
        components:
          dom0:
            builder:
              layers:
                - "../../../meta-xen-dom0"
                - "../../../meta-xen-domx"
                - "../meta-openembedded/meta-multimedia"
              external_src:
                core-image-thin-initramfs: "%{YOCTOS_WORK_DIR}/%{DOMD_BUILD_DIR}/tmp/deploy/images/%{MACHINE}/"
              conf:
                - [XT_XEN_DTB_NAME, "%{XT_XEN_DTB_NAME}"]
                - [BBMASK:append, "|meta-xt-prod-devel-rcar-gen4/meta-xt-dom0-gen4/recipes-kernel"]
          domd:
            builder:
              layers:
                - "../../../meta-xen-domd"
                - "../../../meta-xen-domx"
                - "../meta-openembedded/meta-multimedia"
              conf:
                - [IMAGE_INSTALL:append, " iperf3 htop tcpdump coreutils ethtool"]
                - [BBMASK:append, "|meta-xt-rcar/meta-xt-gateway/meta-xt-domd-gen4/recipes-bsp/u-boot"]
                - [BBMASK:append, "|meta-xt-prod-devel-rcar-gen4/meta-xt-domd-gen4/recipes-bsp/u-boot"]
                  #- [BBMASK:append, "|meta-renesas-upstream-bsp/recipes-bsp/optee"]
                  #- [BBMASK:append, "|meta-renesas-upstream-bsp/recipes-bsp/arm-trusted-firmware/"]
                # GFX doesn't support now
                - [BBMASK:append, "|recipes-graphics/gles-user-module"]
                - [BBMASK:append, "|recipes-kernel/kernel-module-gles"]
                - [BBMASK:append, "|meta-xt-rcar/meta-xt-rcar-gles_common/recipes-graphics/gles-module"]
                - [BBMASK:append, "|meta-xt-rcar/meta-xt-rcar-gles_common/recipes-kernel/kernel-module-gles"]
                - [BBMASK:append, "|meta-sparrow-hawk/recipes-core/systemd/"]
                # rcar-image-XXXX is not prepared in upstream-bsp
                - [BBMASK:append, "|meta-xt-prod-devel-rcar-gen4/meta-xt-domd-gen4/recipes-core/images/rcar-"]
                - [BBMASK:append, "|meta-xt-prod-devel-rcar-gen4/meta-xt-driver-domain-gen4/recipes-core/images/rcar-"]
                # CPU rendering
                - [IMAGE_INSTALL:append, " mesa glmark2 kernel-devicetree"]
                - [DISTRO_FEATURES_NATIVESDK:append, "wayland x11"]
                - [DISTRO_FEATURES:append, " pam wayland"]
                - [DISTRO_FEATURES:remove, " ptest x11 vulkan"]
                #- [IMAGE_INSTALL:append, " optee-os"]
              target_images:
                - "tmp/deploy/images/%{MACHINE}/flash.bin"
          domu:
            builder:
              layers:
                - "../meta-openembedded/meta-networking"
                - "../meta-openembedded/meta-multimedia"
                - "../../../meta-xen-domu"
                - "../../../meta-xen-domx"
              conf:
                - [IMAGE_INSTALL:append, " iperf3 htop tcpdump libaio coreutils rt-tests ethtool fio"]
                - [EXTRA_IMAGE_FEATURES:append, " ssh-server-openssh"]
        images:
          full:
            partitions:
              boot:
                items:
                  "flash.bin": "%{YOCTOS_WORK_DIR}/build-domd/tmp/deploy/images/%{MACHINE}/flash.bin"
                  "fitImage": "%{YOCTOS_WORK_DIR}/build-dom0/tmp/deploy/images/generic-armv8-xt/fitImage"

